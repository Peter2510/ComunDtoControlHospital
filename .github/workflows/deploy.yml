name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # IMPORTANTE: Se necesitan permisos de escritura para crear el tag
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        # Necesario para que el paso de tagging funcione, ya que crea el tag en el HEAD
        with:
          fetch-depth: 0 

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Maven settings for GitHub Packages
        run: |
          mkdir -p $HOME/.m2
          echo "<settings>
                    <servers>
                      <server>
                        <id>github</id>
                        <username>${{ github.actor }}</username>
                        <password>${{ secrets.PERSONAL_ACCESS_TOKEN }}</password>
                      </server>
                    </servers>
                  </settings>" > $HOME/.m2/settings.xml

      ---
      
      # Paso 1: Define la versión sin el sufijo -SNAPSHOT y guárdala para usarla después
      - name: Set Dynamic Version Variable
        id: set_version
        run: echo "NEW_VERSION=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      # Paso 2: Construye y despliega usando la nueva versión dinámica.
      # Usamos el plugin 'versions:set' para modificar el pom.xml temporalmente en el runner.
      - name: Build and Deploy (with NEW_VERSION)
        working-directory: ./
        run: | 
          VERSION=${{ steps.set_version.outputs.NEW_VERSION }}
          # Establece la versión y luego despliega con el comando 'deploy'
          mvn versions:set -DnewVersion=$VERSION
          mvn clean deploy -DskipTests
      
      ---

      # Paso 3: Crea el Tag en GitHub. Esto solo se ejecuta si la construcción es exitosa.
      - name: Create and Push Git Tag
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            // Recupera la nueva versión
            const version = process.env.NEW_VERSION;
            
            // Crea la referencia del tag en GitHub
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${version}`,
              sha: context.sha
            });
            
            console.log(`Tag creado exitosamente: ${version}`);
        env:
          NEW_VERSION: ${{ steps.set_version.outputs.NEW_VERSION }}
