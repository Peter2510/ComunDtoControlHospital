name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Maven settings for GitHub Packages
        run: |
          mkdir -p $HOME/.m2
          echo "<settings>
                    <servers>
                      <server>
                        <id>github</id>
                        <username>${{ github.actor }}</username>
                        <password>${{ secrets.PERSONAL_ACCESS_TOKEN }}</password>
                      </server>
                    </servers>
                  </settings>" > $HOME/.m2/settings.xml
      
      - name: Set Dynamic Version Variable
        id: set_version
        run: echo "NEW_VERSION=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build and Deploy (with NEW_VERSION)
        working-directory: ./
        run: | 
          VERSION=${{ steps.set_version.outputs.NEW_VERSION }}
          # Establece la versión y luego despliega con el comando 'deploy'
          mvn versions:set -DnewVersion=$VERSION
          mvn clean deploy -DskipTests
      
      - name: Create and Push Git Tag
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            // Recupera la nueva versión
            const version = process.env.NEW_VERSION;
            
            // Crea la referencia del tag en GitHub
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${version}`,
              sha: context.sha
            });
            
            console.log(`Tag creado exitosamente: ${version}`);
        env:
          NEW_VERSION: ${{ steps.set_version.outputs.NEW_VERSION }}

      - name: Create GitHub Release 🚀
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.set_version.outputs.NEW_VERSION }}
          name: Release ${{ steps.set_version.outputs.NEW_VERSION }}
          body: |
            Automated release for version ${{ steps.set_version.outputs.NEW_VERSION }}.
            Built via GitHub Actions run ${{ github.run_number }}.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
